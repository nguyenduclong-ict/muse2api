<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>muse2apiv2 Cookie Manager</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #09090b;
      color: #f4f4f5;
    }
    h1 { font-size: 14px; margin: 0 0 4px; }
    h2 { font-size: 12px; margin: 0 0 6px; color: #e4e4e7; }
    p { font-size: 11px; color: #a1a1aa; margin: 0 0 10px; line-height: 1.4; }
    .divider {
      height: 1px;
      background: #27272a;
      margin: 12px 0;
    }
    textarea {
      width: 100%;
      min-height: 74px;
      padding: 8px;
      margin-bottom: 8px;
      border: 1px solid #27272a;
      border-radius: 8px;
      background: #18181b;
      color: #f4f4f5;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11px;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #3b82f6; }
    button.secondary { background: #059669; }
    button.secondary:hover { background: #10b981; }
    #status { margin-top: 10px; font-size: 11px; min-height: 16px; line-height: 1.4; }
    .ok { color: #34d399; }
    .err { color: #fb7185; }
  </style>
</head>
<body>
  <h1>muse2apiv2 Cookie Manager</h1>
  <p>Export cookies from this browser or import cookies copied from the console into <strong>muse.ai</strong>.</p>
  <button id="copyBtn">Copy muse.ai Cookies</button>

  <div class="divider"></div>

  <h2>Import Cookies to muse.ai</h2>
  <textarea id="importInput" placeholder="Paste Cookie header string (hatch_sess=...; ...) or JSON..."></textarea>
  <button id="importBtn" class="secondary">Import Cookies</button>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
