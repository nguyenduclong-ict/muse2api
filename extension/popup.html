<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>muse2apiv2 Cookie Manager</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 360px;
        margin: 0;
        padding: 14px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #09090b;
        color: #f4f4f5;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      h1 {
        font-size: 14px;
        margin: 0;
        font-weight: 600;
      }
      .badge {
        font-size: 11px;
        font-weight: 500;
        padding: 2px 8px;
        border-radius: 999px;
        background: #18181b;
        border: 1px solid #27272a;
        color: #a1a1aa;
        white-space: nowrap;
      }
      .badge.has-cookies {
        color: #93c5fd;
        border-color: #1e3a8a;
        background: #0f172a;
      }
      h2 {
        font-size: 12px;
        margin: 0;
        color: #e4e4e7;
        font-weight: 600;
      }
      .section-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }
      .target-box {
        padding: 10px;
        border: 1px solid #27272a;
        border-radius: 8px;
        background: #111114;
        margin-bottom: 12px;
      }
      .target-label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: #a1a1aa;
        margin-bottom: 6px;
      }
      .input-row {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      input[type="text"] {
        flex: 1;
        min-width: 0;
        padding: 6px 8px;
        border: 1px solid #27272a;
        border-radius: 6px;
        background: #18181b;
        color: #f4f4f5;
        font-size: 12px;
      }
      input[type="text"]:focus,
      textarea:focus {
        outline: none;
        border-color: #3b82f6;
      }
      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: #a1a1aa;
        cursor: pointer;
        user-select: none;
      }
      .checkbox-row input[type="checkbox"] {
        margin: 0;
        accent-color: #2563eb;
        cursor: pointer;
      }
      .segmented {
        display: flex;
        gap: 4px;
        padding: 3px;
        border-radius: 8px;
        background: #18181b;
        border: 1px solid #27272a;
        margin-bottom: 8px;
      }
      .seg-btn {
        flex: 1;
        padding: 5px 8px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #a1a1aa;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }
      .seg-btn:hover {
        color: #f4f4f5;
        background: #27272a;
      }
      .seg-btn.active {
        background: #27272a;
        color: #fff;
      }
      .btn-row {
        display: flex;
        gap: 6px;
      }
      .divider {
        height: 1px;
        background: #27272a;
        margin: 12px 0;
      }
      textarea {
        width: 100%;
        min-height: 76px;
        padding: 8px;
        margin-bottom: 6px;
        border: 1px solid #27272a;
        border-radius: 8px;
        background: #18181b;
        color: #f4f4f5;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
        resize: vertical;
      }
      .hint {
        font-size: 11px;
        color: #a1a1aa;
        min-height: 15px;
        margin-bottom: 8px;
      }
      button {
        padding: 8px 12px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button.full {
        width: 100%;
      }
      button.flex-1 {
        flex: 1;
      }
      button.small {
        padding: 5px 9px;
        font-size: 11px;
        border-radius: 6px;
      }
      button:hover {
        background: #3b82f6;
      }
      button.secondary {
        background: #059669;
      }
      button.secondary:hover {
        background: #10b981;
      }
      button.danger {
        background: #dc2626;
      }
      button.danger:hover {
        background: #ef4444;
      }
      button.danger-outline {
        width: 100%;
        background: transparent;
        border: 1px solid #7f1d1d;
        color: #fca5a5;
      }
      button.danger-outline:hover {
        background: #450a0a;
        border-color: #dc2626;
        color: #fecaca;
      }
      button.ghost {
        background: #27272a;
        color: #e4e4e7;
      }
      button.ghost:hover {
        background: #3f3f46;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .import-options {
        margin-bottom: 8px;
      }
      .confirm-box {
        display: none;
        padding: 10px;
        border: 1px solid #7f1d1d;
        border-radius: 8px;
        background: #1c1012;
      }
      .confirm-box.visible {
        display: block;
      }
      .confirm-box p {
        margin: 0 0 8px;
        color: #fecaca;
        font-size: 11px;
        line-height: 1.4;
      }
      .confirm-actions {
        display: flex;
        gap: 8px;
      }
      .confirm-actions button {
        flex: 1;
      }
      #status {
        margin-top: 10px;
        font-size: 11px;
        min-height: 16px;
        line-height: 1.4;
        color: #a1a1aa;
        word-break: break-word;
      }
      #status.ok {
        color: #34d399;
      }
      #status.warn {
        color: #fbbf24;
      }
      #status.err {
        color: #fb7185;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Cookie Manager</h1>
      <span id="cookieCount" class="badge">—</span>
    </div>

    <div class="target-box">
      <label class="target-label" for="siteInput">Target Site</label>
      <div class="input-row">
        <input id="siteInput" type="text" placeholder="https://example.com" spellcheck="false" />
        <button id="useCurrentBtn" type="button" class="ghost small">Current</button>
      </div>
      <label class="checkbox-row">
        <input id="includeSubdomains" type="checkbox" checked />
        <span id="subdomainsLabel">Include subdomains</span>
      </label>
    </div>

    <div class="section-row">
      <h2>Export Cookies</h2>
    </div>
    <div class="segmented" role="group" aria-label="Export format">
      <button type="button" class="seg-btn active" data-format="header">Header</button>
      <button type="button" class="seg-btn" data-format="json">JSON</button>
      <button type="button" class="seg-btn" data-format="netscape">Netscape</button>
    </div>
    <div class="btn-row">
      <button id="copyBtn" type="button" class="flex-1">Copy Cookies</button>
      <button id="downloadBtn" type="button" class="ghost">Download</button>
    </div>

    <div class="divider"></div>

    <div class="section-row">
      <h2>Import Cookies</h2>
      <button id="loadFileBtn" type="button" class="ghost small">Load File</button>
      <input id="importFile" type="file" accept=".json,.txt,.cookies,*/*" hidden />
    </div>
    <textarea
      id="importInput"
      placeholder="Paste Cookie header, JSON, or Netscape cookies.txt..."
    ></textarea>
    <div id="importHint" class="hint"></div>
    <div class="import-options">
      <label class="checkbox-row">
        <input id="clearBeforeImport" type="checkbox" checked />
        <span>Clear site data before import</span>
      </label>
    </div>
    <button id="importBtn" type="button" class="secondary full">Import Cookies</button>

    <div class="divider"></div>

    <button id="clearBtn" type="button" class="danger-outline">Clear Site Data</button>
    <div id="clearConfirm" class="confirm-box" role="alertdialog" aria-labelledby="clearConfirmMsg">
      <p id="clearConfirmMsg">
        Clear all site data for <strong id="clearTargetName">this site</strong> (cookies, storage,
        cache, service workers) and reload open tabs?
      </p>
      <div class="confirm-actions">
        <button id="cancelClearBtn" type="button" class="ghost">Cancel</button>
        <button id="confirmClearBtn" type="button" class="danger">Confirm Clear</button>
      </div>
    </div>

    <div id="status"></div>
    <script src="cookie-utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
