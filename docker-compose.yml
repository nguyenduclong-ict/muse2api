services:
  muse2apiv2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muse2apiv2
    ports:
      - "${MUSE2API_PORT:-9123}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MUSE2API_DATA_DIR: /app/data
      MUSE2API_DB_PATH: /app/db/muse2apiv2.db
    volumes:
      - ./data:/app/data
      - muse2apiv2_db:/app/db
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  muse2apiv2_db:
